name: Build Signed Royal 3-Card Casino 3D Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Keystore and Sign APK
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
          STORE_PASS="royal3card2026"
          KEY_ALIAS="royal3cardkey"
          KEY_PASS="royal3card2026"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Playzone Studio, OU=Games, O=Playzone Studio, L=Aligarh, ST=UP, C=IN"

          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

          mkdir -p signed_output
          cp app/build/outputs/apk/release/*.apk signed_output/
          cp "$KEYSTORE_PATH" signed_output/release-keystore.jks

      - name: Upload Signed APK and Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Royal3CardCasino3D-Signed-v21000
          path: signed_output/*
