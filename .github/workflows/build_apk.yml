name: Build Signed Royal 3-Card Casino 3D Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Sign Release APK with apksigner
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
          STORE_PASS="royal3card2026"
          KEY_ALIAS="royal3cardkey"
          KEY_PASS="royal3card2026"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Playzone Studio, OU=Games, O=Playzone Studio, L=Aligarh, ST=UP, C=IN"

          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          APK_UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)

          mkdir -p signed_output
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "signed_output/app-release.apk" \
            "$APK_UNSIGNED"

          cp "$KEYSTORE_PATH" signed_output/release-keystore.jks

      - name: Upload Signed APK and Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Royal3CardCasino3D-Signed-v21000
          path: signed_output/*
